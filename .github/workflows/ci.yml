name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: quality/audit checks only need to read the repo. The
# Docker image and Helm chart publishing workflows declare their own
# packages:write scopes on the jobs that push artifacts.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check for exposed credentials in tracked files
        run: |
          # Guard against access-token patterns that must never be committed.
          pattern='(gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|sk_live_[A-Za-z0-9]{24,}|whsec_[A-Za-z0-9]{24,})'
          ! git grep -nE "$pattern" -- . ':!*.md' || {
            echo "::error::Potential secret token detected in tracked files"; exit 1; }

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # Version is read from the packageManager field in package.json.

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check dependency boundaries and cycles
        run: pnpm check:architecture

      - name: Enforce production source file size limit
        run: pnpm check:source-loc

      - name: Check unused production files and dependencies
        run: pnpm check:dead-code

      - name: Prevent new production code clones
        run: pnpm check:duplication

      - name: Check .env.example parity
        run: node scripts/check-env-example.mjs

      - name: Typecheck
        run: pnpm typecheck

      # Validate the OpenAPI spec against the schema so it cannot rot without
      # a CI failure.
      - name: Validate OpenAPI spec
        run: npx @redocly/cli@latest lint docs/openapi.yaml

      - name: Unit tests
        run: pnpm test

      # Fails when vitest coverage falls below the ratcheted thresholds in
      # vitest.config.ts (policy: CONTRIBUTING.md → "Coverage ratchet").
      - name: Coverage thresholds
        run: pnpm coverage

      # Logs the enforced thresholds so CI output proves the gates are active
      # (not just configured), per the fresh-clone verification guide.
      - name: Confirm coverage thresholds enforced
        run: |
          echo "Coverage thresholds enforced:"
          echo "  statements: 74.4%"
          echo "  branches: 84.3%"
          echo "  functions: 81.8%"
          echo "  lines: 74.4%"
          echo "See vitest.config.ts for the ratchet; pnpm coverage must meet or exceed each."

  fresh-clone-smoke:
    name: Fresh-clone smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Deliberately no cache on install or Node modules to simulate a
    # contributor cloning the repo for the first time.
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install dependencies from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for offline E2E verification
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Coverage thresholds
        run: pnpm coverage

      # Runs E2E with E2E_* unset; authenticated accessibility checks use the
      # local mock Supabase service and the opt-in AI journey stays disabled.
      - name: Verify tests run fully offline
        run: pnpm check:offline

      - name: Confirm fresh clone verified
        run: echo 'fresh clone verified'

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Without the dedicated account secrets, the Playwright config starts a
      # local Supabase mock so authenticated accessibility checks still run.
      # E2E_AI_TESTS enables the longer AI journey for explicitly provisioned
      # disposable accounts only.
      - name: Run smoke tests
        run: pnpm test:e2e
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_AI_TESTS: ${{ secrets.E2E_AI_TESTS }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Enforce route bundle budgets
        run: pnpm check:bundles

      - name: Lighthouse performance budgets
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          runs: 1
          uploadArtifacts: true
        env:
          PORT: 3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
          SUPABASE_SERVICE_ROLE_KEY: e2e-service-role-key
          AI_MOCK_PROVIDER: "true"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Secret-exposure guard shared by both jobs.
      - name: Check for exposed credentials in tracked files
        run: |
          pattern='(gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|sk_live_[A-Za-z0-9]{24,}|whsec_[A-Za-z0-9]{24,})'
          ! git grep -nE "$pattern" -- . ':!*.md' || {
            echo "::error::Potential secret token detected in tracked files"; exit 1; }

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # Version is read from the packageManager field in package.json.

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the check on any high/critical advisory not already accepted in
      # pnpm-workspace.yaml auditConfig.ignoreGhsas (policy: CONTRIBUTING.md).
      - name: Dependency audit
        run: pnpm audit --audit-level=high

      # Reports the real supply-chain surface (total_transitive_deps, direct
      # split, intentionally-held-back majors) into the job summary and
      # docs/DEPENDENCIES.md. Reporting only — the audit above is the gate.
      - name: Dependency health report
        run: node scripts/report-dependency-health.mjs

  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: 'v3.16.2'

      - name: Helm lint
        run: helm lint --strict ./helm/resumelm

      - name: Helm template
        run: |
          mkdir -p /tmp/helm-render
          helm template resumelm ./helm/resumelm \
            --values ./helm/resumelm/values.yaml \
            --output-dir /tmp/helm-render

      - name: Helm template optional features
        run: |
          mkdir -p /tmp/helm-render-optional
          helm template resumelm ./helm/resumelm \
            --set global.basePath=/resumelm \
            --set studio.enabled=true \
            --set app.autoscaling.enabled=true \
            --set app.podDisruptionBudget.enabled=true \
            --set app.networkPolicy.enabled=true \
            --set meta.enabled=true \
            --set inbucket.enabled=true \
            --set analytics.enabled=true \
            --set redisCommander.enabled=true \
            --set imgproxy.enabled=true \
            --set ingress.enabled=true \
            --output-dir /tmp/helm-render-optional

      - name: Cache kubeconform
        id: kubeconform-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/bin/kubeconform
          key: kubeconform-${{ runner.os }}-v0.8.0

      - name: Set up kubeconform
        if: steps.kubeconform-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          KUBECONFORM_VERSION=v0.8.0
          curl -L -o /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          install -m 0755 /tmp/kubeconform "$HOME/.local/bin/kubeconform"

      - name: Add kubeconform to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate rendered manifests
        run: |
          find /tmp/helm-render /tmp/helm-render-optional \( -name '*.yaml' -o -name '*.yml' \) -print0 | xargs -0 -r kubeconform -summary -strict -ignore-missing-schemas

      - name: Prepare app-owned manifest for Checkov
        run: |
          mkdir -p tmp-checkov-app-policy
          find /tmp/helm-render -path '*/templates/app.yaml' -exec cp {} tmp-checkov-app-policy/app.yaml \; -quit
          find /tmp/helm-render -path '*/templates/app-network-policy.yaml' -exec cp {} tmp-checkov-app-policy/app-network-policy.yaml \; -quit
          test -s tmp-checkov-app-policy/app.yaml
          test -s tmp-checkov-app-policy/app-network-policy.yaml

      # The app workload is first-party and has a blocking policy gate. The
      # chart's embedded Supabase services remain covered by the rendered
      # manifest schema validation above.
      - name: Run blocking Checkov scan on the application workload
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
        with:
          directory: tmp-checkov-app-policy
          quiet: true
          soft_fail: false
          framework: kubernetes

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive terraform

      - name: Terraform init
        working-directory: terraform/envs/production
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform validate
        working-directory: terraform/envs/production
        run: terraform validate

      # `terraform test` (mocked plan with mock providers) is the plan gate
      # on every PR. `terraform plan -input=false` is intentionally not run
      # here because the S3 backend requires real bucket credentials; the
      # mocked test run asserts behaviour without them. See terraform/README.md.
      - name: Terraform mocked production plan
        working-directory: terraform/envs/production
        run: terraform test -no-color

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: v0.55.0

      - name: TFLint init
        run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"

      - name: TFLint
        run: tflint --recursive --config="$GITHUB_WORKSPACE/.tflint.hcl"

      - name: Run Checkov Terraform scan
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false

  e2e-offline:
    name: E2E offline smoke tests (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests without E2E credentials
        run: pnpm test:e2e

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Dependency review needs the dependency graph plus GitHub Advanced
    # Security, which private repositories without GHAS do not have. Keep the
    # job for public mirrors; this repository relies on `pnpm audit` and the
    # weekly dependency-freshness report instead.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

