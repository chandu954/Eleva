name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: quality/audit checks only need to read the repo. The
# Docker image and Helm chart publishing workflows declare their own
# packages:write scopes on the jobs that push artifacts.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for exposed credentials in tracked files
        run: |
          # Guard against access-token patterns that must never be committed.
          pattern='(gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,})'
          ! git grep -nE "$pattern" -- . ':!*.md' || {
            echo "::error::Potential GitHub access token detected in tracked files"; exit 1; }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # Version is read from the packageManager field in package.json.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Fails when vitest coverage falls below the ratcheted thresholds in
      # vitest.config.ts (policy: CONTRIBUTING.md → "Coverage ratchet").
      - name: Coverage thresholds
        run: pnpm coverage

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Secret-exposure guard shared by both jobs.
      - name: Check for exposed credentials in tracked files
        run: |
          pattern='(gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,})'
          ! git grep -nE "$pattern" -- . ':!*.md' || {
            echo "::error::Potential GitHub access token detected in tracked files"; exit 1; }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # Version is read from the packageManager field in package.json.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the check on any high/critical advisory not already accepted in
      # pnpm-workspace.yaml auditConfig.ignoreGhsas (policy: CONTRIBUTING.md).
      - name: Dependency audit
        run: pnpm audit --audit-level=high

  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.2'

      - name: Helm lint
        run: helm lint --strict ./helm/resumelm

      - name: Helm template
        run: |
          mkdir -p /tmp/helm-render
          helm template resumelm ./helm/resumelm \
            --values ./helm/resumelm/values.yaml \
            --output-dir /tmp/helm-render

      - name: Set up kubeconform
        run: |
          KUBECONFORM_VERSION=v0.6.7
          curl -L -o /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          chmod +x /tmp/kubeconform
          mv /tmp/kubeconform /usr/local/bin/ || cp /tmp/kubeconform /usr/local/bin/

      - name: Validate rendered manifests
        run: |
          find /tmp/helm-render -name '*.yaml' -o -name '*.yml' | xargs -r kubeconform -summary -strict -ignore-missing-schemas

      - name: Run Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: helm/resumelm
          quiet: true
          soft_fail: false
          framework: kubernetes,helm
