name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: quality/audit checks only need to read the repo. The
# Docker image and Helm chart publishing workflows declare their own
# packages:write scopes on the jobs that push artifacts.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for exposed credentials in tracked files
        run: |
          # Guard against access-token patterns that must never be committed.
          pattern='(gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,})'
          ! git grep -nE "$pattern" -- . ':!*.md' || {
            echo "::error::Potential GitHub access token detected in tracked files"; exit 1; }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # Version is read from the packageManager field in package.json.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check dependency boundaries and cycles
        run: pnpm check:architecture

      - name: Enforce production source file size limit
        run: pnpm check:source-loc

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Fails when vitest coverage falls below the ratcheted thresholds in
      # vitest.config.ts (policy: CONTRIBUTING.md → "Coverage ratchet").
      - name: Coverage thresholds
        run: pnpm coverage

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Public checks use the unreachable Supabase endpoint. Authenticated
      # checks and the AI integration journey require dedicated test secrets.
      - name: Run smoke tests
        run: pnpm test:e2e
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_AI_TESTS: ${{ secrets.E2E_AI_TESTS }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Enforce route bundle budgets
        run: pnpm check:bundles

      - name: Lighthouse performance budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          runs: 1
          uploadArtifacts: true
        env:
          PORT: 3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
          SUPABASE_SERVICE_ROLE_KEY: e2e-service-role-key
          AI_MOCK_PROVIDER: "true"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Secret-exposure guard shared by both jobs.
      - name: Check for exposed credentials in tracked files
        run: |
          pattern='(gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,})'
          ! git grep -nE "$pattern" -- . ':!*.md' || {
            echo "::error::Potential GitHub access token detected in tracked files"; exit 1; }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # Version is read from the packageManager field in package.json.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the check on any high/critical advisory not already accepted in
      # pnpm-workspace.yaml auditConfig.ignoreGhsas (policy: CONTRIBUTING.md).
      - name: Dependency audit
        run: pnpm audit --audit-level=high

  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.2'

      - name: Helm lint
        run: helm lint --strict ./helm/resumelm

      - name: Helm template
        run: |
          mkdir -p /tmp/helm-render
          helm template resumelm ./helm/resumelm \
            --values ./helm/resumelm/values.yaml \
            --output-dir /tmp/helm-render

      - name: Helm template optional features
        run: |
          mkdir -p /tmp/helm-render-optional
          helm template resumelm ./helm/resumelm \
            --set global.basePath=/resumelm \
            --set studio.enabled=true \
            --set meta.enabled=true \
            --set inbucket.enabled=true \
            --set analytics.enabled=true \
            --set redisCommander.enabled=true \
            --set imgproxy.enabled=true \
            --set ingress.enabled=true \
            --output-dir /tmp/helm-render-optional

      - name: Cache kubeconform
        id: kubeconform-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/kubeconform
          key: kubeconform-${{ runner.os }}-v0.8.0

      - name: Set up kubeconform
        if: steps.kubeconform-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          KUBECONFORM_VERSION=v0.8.0
          curl -L -o /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          install -m 0755 /tmp/kubeconform "$HOME/.local/bin/kubeconform"

      - name: Add kubeconform to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate rendered manifests
        run: |
          find /tmp/helm-render /tmp/helm-render-optional \( -name '*.yaml' -o -name '*.yml' \) -print0 | xargs -0 -r kubeconform -summary -strict -ignore-missing-schemas

      - name: Run Checkov security scan
        uses: bridgecrewio/checkov-action@v12.3135.0
        with:
          directory: helm/resumelm
          quiet: true
          # The chart renders the complete self-hosted Supabase stack (db,
          # kong, auth, rest, realtime, storage, …). Its upstream manifests do
          # not yet ship hardened securityContexts, NetworkPolicies or digest
          # pins, so the scan reports those findings without blocking every
          # PR. Tighten the app-owned templates first, then flip this back to
          # soft_fail: false once the vendor templates carry the same baseline.
          soft_fail: true
          framework: kubernetes,helm

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive terraform

      - name: Terraform init
        working-directory: terraform/envs/production
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform validate
        working-directory: terraform/envs/production
        run: terraform validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.55.0

      - name: TFLint init
        run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"

      - name: TFLint
        run: tflint --recursive --config="$GITHUB_WORKSPACE/.tflint.hcl"

      - name: Run Checkov Terraform scan
        uses: bridgecrewio/checkov-action@v12.3135.0
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false

