name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published query packs catch older code too.
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # JavaScript/TypeScript is interpreted, so CodeQL does not need a build.
      # This repository is private and does not have GitHub Advanced Security,
      # so the code scanning upload endpoint returns 403. Running the analysis
      # with `upload: never` still executes the security-and-quality queries on
      # every PR; the SARIF report is attached as a workflow artifact below for
      # review. Switch to `upload: always` after enabling code scanning.
      - name: Perform CodeQL analysis
        id: codeql
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          category: "/language:javascript-typescript"
          upload: never
          output: codeql-results

      - name: Upload CodeQL SARIF report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-sarif
          path: codeql-results/*.sarif
          if-no-files-found: ignore
          retention-days: 14
