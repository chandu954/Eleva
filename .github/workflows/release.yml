name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (leave empty to create from latest main)"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: tag
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ]; then
            # workflow_dispatch without a tag: tag the latest main commit
            TAG="v$(date +%Y.%m.%d.%H%M%S)"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@de220e04c0064179051c313a4f6fb78d92adcd93 # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Release ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Release summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## Release created

          | Property | Value |
          |----------|-------|
          | Tag | `${{ steps.tag.outputs.tag }}` |
          | Repository | `${{ github.repository }}` |

          Release notes were auto-generated from commits since the previous tag.
          EOF
