{{- if and .Values.app.enabled .Values.app.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "resumelm.fullname" . }}-app
  labels:
    {{- include "resumelm.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  podSelector:
    matchLabels:
      {{- include "resumelm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  policyTypes:
    - Ingress
{{- if .Values.app.networkPolicy.ingressFrom }}
  ingress:
{{ range .Values.app.networkPolicy.ingressFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 3000
{{ end }}
{{- else }}
  ingress: []
{{- end }}
{{- end }}
