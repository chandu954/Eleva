# Gitleaks configuration for the full-history CI scan.
#
# The default ruleset is kept; only documented, non-secret placeholders are
# allowlisted. Real credentials must never be added here.
[extend]
useDefault = true

[[allowlists]]
description = "Self-hosted Supabase demo keys and Stripe test placeholders that ship in Helm defaults and unit fixtures"
paths = [
  '''helm/resumelm/values\.yaml''',
  '''src/test/fixtures/constants\.ts''',
]
regexes = [
  '''sk_test_placeholder''',
  '''sk_test_configured(_client)?''',
  '''sk_test_mock_not_a_real_key''',
  '''whsec_mock_not_a_real_key''',
  '''sk_test_mock_not_a_real_provider_key''',
]
